service: api
runtime: nodejs20
env: standard

automatic_scaling:
  target_cpu_utilization: 0.65
  min_instances: 0
  max_instances: 10

entrypoint: npm start

env_variables:
  NODE_ENV: production
  LOG_LEVEL: info
  ALLOWED_ORIGIN: https://evalgpt.com
  RATE_LIMIT_MAX: "5"
  RATE_LIMIT_WINDOW_MS: "3600000"
  DAILY_RUN_LIMIT: "100"
  EVALUATIONS_ENABLED: "true"
  EVALUATION_TIMEOUT_MS: "150000"
  USE_GOOGLE_IDENTITY_TOKEN: "true"
  # PRD_JUDGE_RUNTIME_URL and PRD_JUDGE_RUNTIME_AUDIENCE are set in the
  # generated, git-ignored app.local.yaml after the private Cloud Run deploy.
  # INTERNAL_SERVICE_TOKEN comes from Secret Manager, never this file.

handlers:
  - url: /.*
    script: auto
    secure: always
