service: default
runtime: nodejs20
env: standard

handlers:
  # Let the Node server handle all routes (SPA)
  - url: /.*
    script: auto
    secure: always
    http_headers:
      X-Content-Type-Options: nosniff
      Referrer-Policy: no-referrer
      Permissions-Policy: "camera=(), microphone=(), geolocation=()"
      Content-Security-Policy: "default-src 'self'; connect-src 'self' https://*.r.appspot.com; img-src 'self' data: blob:; style-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"

env_variables:
  NODE_ENV: production
